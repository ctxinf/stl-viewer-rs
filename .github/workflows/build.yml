name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev ruby-dev rpm libarchive-tools zstd xvfb xdotool weston imagemagick python3-pil
          sudo gem install fpm --no-document
      - name: Resolve dependencies
        run: test -f Cargo.lock || cargo generate-lockfile
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build portable release
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$HOME=/build"
          cargo build --locked --release
      - name: Parser and X11 smoke test
        run: |
          python3 scripts/fixture.py target/triangle.stl
          target/release/stl-viewer-linux --info target/triangle.stl
          xvfb-run -a bash scripts/smoke-x11.sh
          xvfb-run -a python3 scripts/check-dpi.py
      - name: Wayland smoke test
        run: bash scripts/smoke-wayland.sh
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          scripts/package.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
