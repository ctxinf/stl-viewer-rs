name: Build and release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev ruby-dev rpm libarchive-tools zstd xvfb xdotool weston imagemagick python3-pil
          sudo gem install fpm --no-document
      - name: Check release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build portable release
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$HOME=/build"
          cargo build --locked --release
      - name: Parser and X11 smoke test
        run: |
          cp tests/fixtures/triangle.stl target/triangle.stl
          target/release/stl-viewer-linux --info target/triangle.stl
          xvfb-run -a bash scripts/smoke-x11.sh
          xvfb-run -a python3 scripts/check-dpi.py
      - name: Wayland smoke test
        run: bash scripts/smoke-wayland.sh
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          scripts/package.sh "$version"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          path: |
            target/*.log
            target/window-test/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
  install-test:
    needs: linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu:22.04, debian:12, fedora:latest, archlinux:latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: Install package and exercise installed application
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.distro }}" bash scripts/test-install.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-${{ strategy.job-index }}
          path: target/install-test/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, install-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
