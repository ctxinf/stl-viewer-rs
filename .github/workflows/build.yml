name: Build and release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev ruby-dev rpm libarchive-tools zstd xvfb xdotool weston imagemagick python3-pil
          sudo gem install fpm --no-document
      - name: Check release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build portable release
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$HOME=/build"
          cargo build --locked --release
      - name: Parser and X11 smoke test
        run: |
          cp tests/fixtures/triangle.stl target/triangle.stl
          target/release/stl-viewer-linux --info target/triangle.stl
          xvfb-run -a -s "-screen 0 2560x2048x24" bash scripts/smoke-x11.sh
          xvfb-run -a -s "-screen 0 2560x2048x24" python3 scripts/check-dpi.py
      - name: Wayland smoke test
        run: bash scripts/smoke-wayland.sh
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          scripts/package.sh "$version"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs-${{ matrix.arch }}
          path: |
            target/*.log
            target/window-test/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
  desktop:
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x86_64
          - runner: windows-11-arm
            platform: windows
            arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: macos-14
            platform: macos
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: CLI smoke test
        run: |
          target/release/stl-viewer-linux --help
          target/release/stl-viewer-linux info tests/fixtures/triangle.stl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package desktop application
        run: python3 scripts/package-desktop.py "${{ matrix.platform }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
  install-test:
    needs: linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu:22.04, debian:12, fedora:latest, archlinux:latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist
      - name: Install package and exercise installed application
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.distro }}" bash scripts/test-install.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-${{ strategy.job-index }}
          path: |
            target/install-test/
            target/window-test/
            target/x11.log
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, desktop, install-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Combined checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
