[package]
name = "stl-viewer-linux"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "A small, fast native Linux STL viewer"

[dependencies]
glium = "0.36"
glam = "0.30"
memmap2 = "0.9"
rfd = "0.15"
egui_glium = { version = "=0.33.2", default-features = false, features = ["links"] }
egui = "=0.33.2"

png = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
