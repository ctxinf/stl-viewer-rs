[package]
name = "stl-viewer-linux"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "A small, fast native STL, 3MF and OBJ viewer for Linux, Windows and macOS"

[dependencies]
glium = "0.36"
glam = "0.30"
memmap2 = "0.9"
rfd = "0.15"
egui_glium = { version = "=0.33.2", default-features = false, features = ["links", "clipboard"] }
egui = "=0.33.2"

png = "0.18"
tobj = "4"
lib3mf-core = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
